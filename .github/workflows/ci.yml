name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only reads the repository. Jobs that need more
# must opt in explicitly, so a compromised dependency cannot push or open issues.
permissions:
  contents: read

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: git config --global user.email ci@nightwatch.test && git config --global user.name nightwatch-ci
      - run: npm ci
      - run: npm run build
      - run: npm run build:vscode
      - run: npm test
      - name: Policy fixture corpus via CLI
        run: node packages/cli/dist/bin.js policy fixtures
      - name: CLI smoke
        run: node packages/cli/dist/bin.js doctor
