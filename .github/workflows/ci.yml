name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: git config --global user.email ci@nightwatch.test && git config --global user.name nightwatch-ci
      - run: npm ci
      - run: npm run build
      - run: npm run build:vscode
      - run: npm test
      - name: Policy fixture corpus via CLI
        run: node packages/cli/dist/bin.js policy fixtures
      - name: CLI smoke
        run: node packages/cli/dist/bin.js doctor
