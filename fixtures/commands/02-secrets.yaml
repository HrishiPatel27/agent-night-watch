# Credential paths and secret exposure.
- command: "cat .env"
  expect: deny
  reason: SECRET_PATH
- command: "cat .env.local"
  expect: deny
  reason: SECRET_PATH
- command: "cat .env.example"
  expect: allow
- command: "cat ~/.ssh/id_rsa"
  expect: deny
  reason: SECRET_PATH
- command: "cat ~/.aws/credentials"
  expect: deny
  reason: SECRET_PATH
- command: "cat /etc/shadow"
  expect: deny
  reason: SECRET_PATH
- command: "cat config/secrets.yml"
  expect: deny
  reason: SECRET_PATH
- command: "base64 ~/.ssh/id_ed25519"
  expect: deny
  reason: SECRET_PATH
- command: "cp .env /tmp/env.bak"
  expect: deny
  reason: SECRET_PATH
- command: "grep -r password src/"
  expect: allow
  note: searching source code for the word password is legitimate audit work
- command: "echo $OPENAI_API_KEY"
  expect: deny
  reason: SECRET_PATH
- command: "echo ${DATABASE_PASSWORD}"
  expect: deny
  reason: SECRET_PATH
- command: "env"
  expect: deny
  reason: SECRET_PATH
- command: "printenv"
  expect: deny
  reason: SECRET_PATH
- command: "printenv HOME"
  expect: allow
- command: "set"
  expect: deny
  reason: SECRET_PATH
- command: "set -euo pipefail"
  expect: allow
- command: "export -p"
  expect: deny
  reason: SECRET_PATH
- command: "gh auth token"
  expect: deny
  reason: SECRET_PATH
- command: "security find-generic-password -s github"
  expect: deny
  reason: SECRET_PATH
- command: "op read op://vault/item/password"
  expect: deny
- command: "cat /proc/self/environ"
  expect: deny
  reason: SECRET_PATH
- command: "git config --get credential.helper"
  expect: deny
  reason: SECRET_PATH
- command: "python3 -c 'print(open(\".env\").read())'"
  expect: deny
  note: unknown command with a secret path is deferred/denied
- tool: Read
  input: { file_path: ".env" }
  expect: deny
  reason: SECRET_PATH
- tool: Read
  input: { file_path: "~/.aws/config" }
  expect: deny
  reason: SECRET_PATH
- tool: Grep
  input: { pattern: "AKIA", path: "~/.aws" }
  expect: deny
  reason: SECRET_PATH
- tool: Write
  input: { file_path: "certs/server.key", content: "x" }
  expect: deny
  reason: SECRET_PATH
